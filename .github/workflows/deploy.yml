name: Build and deploy GeoSMART@UCF

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geosmart-pages-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static website
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Publish generated files to geosmart branch
        run: |
          git fetch origin geosmart
          git worktree add -B geosmart ../pages-deploy origin/geosmart
          rsync -a --delete --exclude='.git/' out/ ../pages-deploy/
          cd ../pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy GeoSMART@UCF website"
          git push origin geosmart
